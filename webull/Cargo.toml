[package]
name = "webull"
version = "0.1.0"
edition = "2024"

[features]
default = ["http"]
# Enables the HTTP REST client (reqwest) and request signing. With it off
# (`--no-default-features`), only the enums and data models compile — no
# reqwest / hyper / tokio / TLS are pulled in.
http = [
    "dep:reqwest",
    "dep:hmac",
    "dep:sha2",
    "dep:base64",
    "dep:uuid",
    "dep:percent-encoding",
]
# Reserved for future transports (not implemented — REST only for now).
# grpc-events = []
# streaming = []

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
dotenvy = "0.15.7"
